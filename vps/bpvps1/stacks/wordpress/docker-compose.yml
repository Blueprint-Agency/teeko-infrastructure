# Kaiteki legacy WordPress blog — interim hosting on BPVPS1 (staging-first).
# Runs behind the existing Traefik (proxy network). DB stays private (wp-internal).
# Manual-deploy stack (no app repo); compose synced here as the IaC record.
# Long-term plan per kaiteki/CLAUDE.md: export content -> MDX in /blog, then retire this.
services:
  wp-db:
    image: mariadb:11.4
    container_name: wp-db
    restart: unless-stopped
    env_file: .env.wp-db
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - wp-db-data:/var/lib/mysql
    networks:
      - wp-internal

  wordpress:
    image: wordpress:php8.2-apache   # WP core from image; your wp-content is bind-mounted over it
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      - wp-db
    env_file: .env.wordpress
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # kaiteki.my is on a separate Cloudflare account (no DNS-01 access from this VPS).
      # Cloudflare (proxied) terminates public TLS; Traefik serves default cert to origin.
      - "traefik.http.routers.kaiteki-blog.rule=Host(`${WP_HOST}`)"
      - "traefik.http.routers.kaiteki-blog.entrypoints=websecure"
      - "traefik.http.routers.kaiteki-blog.tls=true"
      - "traefik.http.services.kaiteki-blog.loadbalancer.server.port=80"
    networks:
      - proxy
      - wp-internal

volumes:
  wp-db-data:

networks:
  proxy:
    external: true
  wp-internal:
    internal: true
