# Traefik dynamic config — serves the shared LE cert (acme.sh DNS-01) and routes the
# Kaiteki mail web UIs.
#   mail.kaiteki.my    -> Stalwart admin + JMAP endpoint (stalwart:8080)
#   webmail.kaiteki.my -> Bulwark webmail (bulwark:3000)
# Traefik terminates TLS here using the file cert (no per-host ACME — Traefik's CF token
# only covers teeko.ai, not kaiteki.my). Traefik reaches the containers over the external
# stalwart_mailnet network (see traefik compose). The mail.kaiteki.my network alias on
# Traefik (compose) lets Bulwark reach the Stalwart JMAP host internally with a valid cert.
tls:
  certificates:
    - certFile: /certs/fullchain.pem
      keyFile: /certs/key.pem
http:
  routers:
    stalwart-admin:
      entryPoints: [websecure]
      rule: "Host(`mail.kaiteki.my`)"
      service: stalwart-admin
      tls: {}
    bulwark:
      entryPoints: [websecure]
      rule: "Host(`webmail.kaiteki.my`)"
      service: bulwark
      tls: {}
  services:
    stalwart-admin:
      loadBalancer:
        servers:
          - url: "http://stalwart:8080"
    bulwark:
      loadBalancer:
        servers:
          - url: "http://bulwark:3000"
