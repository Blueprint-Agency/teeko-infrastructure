# Traefik dynamic config — routes email.kaiteki.my to the co-hosted Mailcow stack.
#
#   :443  TLS-passthrough  -> Mailcow nginx serves its own self-issued LE cert
#   :80   HTTP forward     -> Mailcow nginx (ACME HTTP-01 challenge + http->https redirect)
#
# Traefik reaches `nginx-mailcow` over the external `mailcow` network
# (mailcowdockerized_mailcow-network) declared in the traefik compose.
# Mailcow owns the cert because Traefik's CF token only covers teeko.ai,
# not kaiteki.my (separate Cloudflare account) — so DNS-01 can't issue it.
tcp:
  routers:
    mailcow-tls:
      entryPoints:
        - websecure
      rule: "HostSNI(`email.kaiteki.my`)"
      tls:
        passthrough: true
      service: mailcow-https
  services:
    mailcow-https:
      loadBalancer:
        servers:
          - address: "nginx-mailcow:8443"
http:
  routers:
    mailcow-http:
      entryPoints:
        - web
      rule: "Host(`email.kaiteki.my`)"
      priority: 1000
      service: mailcow-http-svc
  services:
    mailcow-http-svc:
      loadBalancer:
        servers:
          - url: "http://nginx-mailcow:8080"
