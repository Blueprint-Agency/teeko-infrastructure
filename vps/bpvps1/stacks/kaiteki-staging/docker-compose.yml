# Kaiteki revamped site (Next.js) — STAGING (staging.kaiteki.my).
# App-managed stack: image build/push + `docker compose up` are handled by the
# kaiteki-web repo's deploy-staging.yml (push to the `staging` branch). This compose
# file is the source of truth and is placed on BPVPS1 manually (BPVPS1 is not wired
# into deploy-infra.yml), same as the legacy `kaiteki` stack alongside it.
services:
  kaiteki-staging:
    image: blueprintagency/kaiteki-web:staging
    pull_policy: always
    container_name: kaiteki-staging
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # kaiteki.my is on a SEPARATE Cloudflare account the VPS token can't manage,
      # so no Let's Encrypt DNS-01 here. Cloudflare (proxied, SSL/TLS = Full)
      # terminates public TLS; Traefik serves its default cert to the CF origin pull.
      - "traefik.http.routers.kaiteki-staging.rule=Host(`staging.kaiteki.my`)"
      - "traefik.http.routers.kaiteki-staging.entrypoints=websecure"
      - "traefik.http.routers.kaiteki-staging.tls=true"
      - "traefik.http.services.kaiteki-staging.loadbalancer.server.port=3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
