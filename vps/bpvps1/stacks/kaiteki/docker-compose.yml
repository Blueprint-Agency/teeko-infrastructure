# Kaiteki.my — PRODUCTION (Next.js revamp, standalone server on :3000).
# Cut over 2026-08-01 from the legacy PHP site (blueprintagency/kaiteki-main-old);
# that repo's deploy.yml was deleted so it can no longer publish here.
# App-managed stack: image build/push + `docker compose up` are handled by the
# kaiteki-web repo's deploy-prod.yml (push to `main`). This compose file is the
# source of truth and is placed on BPVPS1 manually (BPVPS1 is not wired into
# deploy-infra.yml), same as the `kaiteki-staging` stack alongside it.
services:
  kaiteki:
    image: blueprintagency/kaiteki-web:prod
    pull_policy: always
    container_name: kaiteki
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # kaiteki.my is on a SEPARATE Cloudflare account the VPS token can't manage,
      # so no Let's Encrypt DNS-01 here. Cloudflare (proxied) terminates public TLS;
      # Traefik serves its default cert to the CF origin pull. CF SSL/TLS mode = Full
      # (or Full-strict with a CF Origin Cert installed on Traefik).
      - "traefik.http.routers.kaiteki.rule=Host(`kaiteki.my`) || Host(`www.kaiteki.my`)"
      - "traefik.http.routers.kaiteki.entrypoints=websecure"
      - "traefik.http.routers.kaiteki.tls=true"
      - "traefik.http.services.kaiteki.loadbalancer.server.port=3000"
    networks:
      - proxy

networks:
  proxy:
    external: true
