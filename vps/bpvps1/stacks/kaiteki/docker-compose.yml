# Kaiteki.my legacy site (static HTML + light PHP, PHP 8.1/Apache, no DB).
# Interim deployment while the Next.js rebuild (kaiteki-main) is in progress.
# Compose synced by infra; image build/push + `docker compose up` are handled by
# the kaiteki-main-old app workflow (app-managed stack, like booking-system/ehailing).
services:
  kaiteki:
    image: blueprintagency/kaiteki-main-old:latest
    pull_policy: always
    container_name: kaiteki
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # kaiteki.my is on a SEPARATE Cloudflare account the VPS token can't manage,
      # so no Let's Encrypt DNS-01 here. Cloudflare (proxied) terminates public TLS;
      # Traefik serves its default cert to the CF origin pull. CF SSL/TLS mode = Full
      # (or Full-strict with a CF Origin Cert installed on Traefik).
      - "traefik.http.routers.kaiteki.rule=Host(`kaiteki.my`) || Host(`www.kaiteki.my`)"
      - "traefik.http.routers.kaiteki.entrypoints=websecure"
      - "traefik.http.routers.kaiteki.tls=true"
      - "traefik.http.services.kaiteki.loadbalancer.server.port=80"
    networks:
      - proxy

networks:
  proxy:
    external: true
