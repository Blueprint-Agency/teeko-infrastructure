# VPS3 - Production Environment
# Traefik handles reverse proxy + TLS via Cloudflare DNS challenge.
# All services on the 'proxy' network. DBs use existing named volumes.
#
# Required .env vars: ACME_EMAIL, CF_DNS_API_TOKEN, BASE_DOMAIN,
#   TRAEFIK_DASHBOARD_AUTH, GRAFANA_ADMIN_PASSWORD
# Required env files: .env.n8n-prod, .env.db-n8n
#
# Monitoring uses vps3-specific subdomains to avoid DNS collision with VPS2:
#   traefik-vps3.${BASE_DOMAIN}, grafana-vps3.${BASE_DOMAIN}

services:

  # ======================================
  # Reverse Proxy
  # ======================================

  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik-vps3.${BASE_DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.http-catchall.rule=hostregexp(`.+`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks:
      - proxy

  # ======================================
  # n8n (production)
  # ======================================

  n8n-prod:
    image: n8nio/n8n:latest
    container_name: n8n-prod
    restart: unless-stopped
    env_file: .env.n8n-prod
    volumes:
      - n8n-data:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-prod.rule=Host(`n8n.${BASE_DOMAIN}`)"
      - "traefik.http.routers.n8n-prod.entrypoints=websecure"
      - "traefik.http.routers.n8n-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n-prod.loadbalancer.server.port=5678"
    networks:
      - proxy

  # NOTE: service named 'db-n8n' so n8n-prod can reach it as DB_POSTGRESDB_HOST=db-n8n
  db-n8n:
    image: postgres:alpine
    container_name: n8n-db
    restart: unless-stopped
    env_file: .env.db-n8n
    volumes:
      - n8n_pgdata:/var/lib/postgresql
    networks:
      - proxy

  # ======================================
  # Monitoring
  # ======================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - proxy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=grafana-vps3.${BASE_DOMAIN}
      - GF_SERVER_ROOT_URL=https://grafana-vps3.${BASE_DOMAIN}
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana-vps3.${BASE_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks:
      - proxy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - proxy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - proxy

volumes:
  traefik-letsencrypt:
  # Existing volumes — do NOT recreate, data already here
  n8n-data:
    external: true
  n8n_pgdata:
    external: true
  # New monitoring volumes
  prometheus-data:
  grafana-data:

networks:
  proxy:
    external: true
