services:
  portainer-agent:
    image: portainer/agent:2.33.6
    container_name: portainer_agent
    restart: always
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    networks:
      - proxy

networks:
  proxy:
    external: true
