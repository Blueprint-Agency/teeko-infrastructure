# Deployed to VPS3 over Tailscale via infra CI (.github/workflows/deploy-infra.yml).
services:
  # Drizzle Gateway — self-hosted Drizzle Studio for managing Postgres.
  # Replaces pgAdmin. Login with MASTERPASS (from .env.gateway), then add DB
  # connections in the UI using in-network hostnames (db-ehailing / db-booking).
  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    pull_policy: always
    container_name: drizzle-gateway
    restart: unless-stopped
    env_file: .env.gateway          # provides MASTERPASS
    environment:
      PORT: "4983"
      STORE_PATH: "/app"            # persisted connections/session live here
    volumes:
      - drizzle-gateway-data:/app
    labels:
      - "traefik.enable=true"
      # drizzle-gateway is attached to 3 networks; tell Traefik which to route on.
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.gateway.rule=Host(`pg3.${BASE_DOMAIN}`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.gateway.loadbalancer.server.port=4983"
    networks:
      - proxy             # Traefik web UI (pg3.teeko.ai)
      - ehailing-network  # reach db-ehailing:5432
      - booking-network   # reach db-booking:5432

  portainer-agent:
    image: portainer/agent:2.33.6
    pull_policy: always
    container_name: portainer_agent
    restart: always
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    networks:
      - proxy

volumes:
  drizzle-gateway-data:
    external: true

networks:
  proxy:
    external: true
  # Owned by the ehailing / booking-system stacks; joined here so the gateway can
  # reach their Postgres containers by service hostname.
  ehailing-network:
    external: true
  booking-network:
    external: true
