# TEMPLATE, rendered by vps/shared/render-ci.py -> /root/stacks/gsc-mcp/gateway-config.yaml.
# Placeholders are filled from the host's GitHub Environment. No real secrets here.
host: https://gsc.@@BASE_DOMAIN@@/
authorization:
  server: http://gsc-dex:5556/
  authorizationProxyEnabled: true
  serverMetadataProxyEnabled: true
  dynamicClientRegistration:
    enabled: true
    publicClient: true
dexGRPCClient:
  addr: gsc-dex:5557
proxy:
  - path: /mcp
    http:
      url: http://gsc-mcp:8080/servers/@@GSC_MCP_PATH_TOKEN@@/mcp/
    authentication:
      enabled: true
