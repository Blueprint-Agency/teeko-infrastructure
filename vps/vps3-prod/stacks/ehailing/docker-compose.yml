services:
  ehailing-be:
    image: blueprintagency/ehailing-be:staging
    pull_policy: always
    container_name: ehailing-be
    restart: unless-stopped
    env_file: .env.ehailing-be
    depends_on:
      db-ehailing:
        condition: service_healthy
      redis-ehailing:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.ehailing-be.rule=Host(`ehailingapi.${BASE_DOMAIN}`)"
      - "traefik.http.routers.ehailing-be.entrypoints=websecure"
      - "traefik.http.routers.ehailing-be.tls.certresolver=letsencrypt"
      - "traefik.http.services.ehailing-be.loadbalancer.server.port=3000"
    networks:
      - proxy
      - ehailing-network

  # Service name 'db-ehailing' = hostname inside ehailing-network.
  # DATABASE_URL should be: postgres://<user>:<pass>@db-ehailing:5432/<db>
  db-ehailing:
    image: postgis/postgis:16-3.4-alpine
    container_name: ehailing-db
    restart: unless-stopped
    env_file: .env.ehailing-db
    environment:
      TZ: Asia/Kuala_Lumpur
      PGTZ: Asia/Kuala_Lumpur
    volumes:
      - ehailing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ehailing-network

  # Service name 'redis-ehailing' = hostname inside ehailing-network.
  # REDIS_URL should be: redis://redis-ehailing:6379
  # Not published to the host — only reachable inside ehailing-network.
  redis-ehailing:
    image: redis:7-alpine
    container_name: ehailing-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ehailing_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ehailing-network

volumes:
  ehailing_pgdata:
    name: ehailing_pgdata
  ehailing_redisdata:
    name: ehailing_redisdata

networks:
  proxy:
    external: true
  ehailing-network:
    name: ehailing-network
    driver: bridge
