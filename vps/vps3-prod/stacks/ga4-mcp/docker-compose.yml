# Google Analytics MCP server (https://github.com/googleanalytics/google-analytics-mcp),
# wrapped with mcp-proxy (https://github.com/sparfenyuk/mcp-proxy) since upstream only
# speaks MCP-over-stdio and ships no HTTP transport or container image.
#
# Auth into GA4 is via a service account key mounted at ./credentials/sa-key.json
# (GOOGLE_APPLICATION_CREDENTIALS + GOOGLE_PROJECT_ID come from .env.ga4-mcp).
#
# Access control: Claude.ai's custom-connector UI only takes a URL (+ optional OAuth
# client id/secret) - no custom headers - so Traefik basic auth doesn't work there.
# Instead the secret IS the path: --named-server mounts the server under
# /servers/<name>/, and <name> is a random token (GA4_MCP_PATH_TOKEN) rather than a
# friendly name. Claude.ai speaks streamable-HTTP (not legacy SSE), so the client URL
# is the /mcp endpoint: https://ga4.<domain>/servers/<token>/mcp
# The /status endpoint is blocked below because it echoes server names, which would
# leak the token to anyone who requests it.
#
# --allow-origin=* enables mcp-proxy's CORS middleware, which emits
# Access-Control-Expose-Headers: Mcp-Session-Id. Claude.ai's connector is a browser
# client; without this it can't read the session id from the initialize response and
# aborts mid-handshake. '*' is safe here because the secret path token - not CORS - is
# the real access boundary, and no cookies/credentials are involved.
services:
  ga4-mcp:
    image: blueprintagency/ga4-mcp:latest
    pull_policy: always
    container_name: ga4-mcp
    restart: unless-stopped
    env_file: .env.ga4-mcp
    command: ["--host=0.0.0.0", "--port=8080", "--pass-environment", "--allow-origin=*", "--named-server", "${GA4_MCP_PATH_TOKEN}", "analytics-mcp"]
    volumes:
      - ./credentials:/credentials:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.ga4-mcp.loadbalancer.server.port=8080"
      # Catch-all: serves /servers/<token>/mcp (and everything else).
      - "traefik.http.routers.ga4-mcp.rule=Host(`ga4.${BASE_DOMAIN}`)"
      - "traefik.http.routers.ga4-mcp.entrypoints=websecure"
      - "traefik.http.routers.ga4-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ga4-mcp.priority=1"
      - "traefik.http.routers.ga4-mcp.service=ga4-mcp"
      # Higher-priority router that blocks /status specifically (leaks server names).
      - "traefik.http.routers.ga4-mcp-status.rule=Host(`ga4.${BASE_DOMAIN}`) && Path(`/status`)"
      - "traefik.http.routers.ga4-mcp-status.entrypoints=websecure"
      - "traefik.http.routers.ga4-mcp-status.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ga4-mcp-status.priority=10"
      - "traefik.http.routers.ga4-mcp-status.service=ga4-mcp"
      - "traefik.http.routers.ga4-mcp-status.middlewares=ga4-deny-all"
      - "traefik.http.middlewares.ga4-deny-all.ipallowlist.sourcerange=127.0.0.1/32"
    networks:
      - proxy

networks:
  proxy:
    external: true
