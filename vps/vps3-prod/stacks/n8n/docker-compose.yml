# deploy trigger
services:
  n8n-prod:
    image: n8nio/n8n:latest
    pull_policy: always
    container_name: n8n-prod
    restart: unless-stopped
    env_file: .env.n8n-prod
    # n8n must start after its postgres — crashes on startup if db-n8n isn't ready
    depends_on:
      - db-n8n
    volumes:
      - n8n-data:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-prod.rule=Host(`n8n.${BASE_DOMAIN}`)"
      - "traefik.http.routers.n8n-prod.entrypoints=websecure"
      - "traefik.http.routers.n8n-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n-prod.loadbalancer.server.port=5678"
    networks:
      - proxy

  # NOTE: service named 'db-n8n' so n8n-prod can reach it as DB_POSTGRESDB_HOST=db-n8n
  # ⚠️ PIN THE MAJOR. This volume holds a PG18 data dir (PGDATA=/var/lib/postgresql/18/docker
  # — the volume is mounted at the PARENT of PGDATA). `postgres:alpine` floats to the newest
  # stable major, so leaving it unpinned means the day 19 goes stable a `compose up` starts
  # PG19 binaries against a PG18 data dir and the container dies with "database files are
  # incompatible with server". Bumping the major is a deliberate pg_upgrade/dump-restore job.
  db-n8n:
    image: postgres:18-alpine
    container_name: n8n-db
    restart: unless-stopped
    env_file: .env.db-n8n
    volumes:
      - n8n_pgdata:/var/lib/postgresql
    networks:
      - proxy

  # Postgres for WABA workflow data (users + flight_reminder tables)
  db-waba:
    image: postgres:18-alpine   # pinned for the same reason as db-n8n above
    container_name: waba-db
    restart: unless-stopped
    env_file: .env.db-waba
    volumes:
      - waba_pgdata:/var/lib/postgresql/data
    networks:
      - proxy

volumes:
  n8n-data:
    external: true
  n8n_pgdata:
    external: true
  waba_pgdata:

networks:
  proxy:
    external: true
