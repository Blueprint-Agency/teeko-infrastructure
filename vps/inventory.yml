# VPS Inventory
# IPs and credentials are in .env (never committed).
# SSH aliases are defined in ~/.ssh/config.

vps:
  vps1-staging:
    ssh_alias: vps1-staging
    host: "${VPS1_HOST}"   # See .env
    hostname: staging
    user: "${VPS1_USER}"   # See .env
    role: staging
    specs:
      cpu: "2 vCPU"
      ram: "8GB"
      disk: "100GB SSD"
    stacks:
      - traefik
      - website             # Teeko Site staging (staging.teeko.ai)
      - webapp              # Teeko Webapp staging
      - n8n                 # n8n dev (stagingn8n.teeko.ai)
      - monitoring          # Grafana + Prometheus + cAdvisor + Node Exporter
      - tools               # pgadmin (stagingpg.teeko.ai) + portainer
    notes: "Smallest VPS. All staging deploys land here."

  vps2-prod:
    ssh_alias: vps2-prod
    host: "${VPS2_HOST}"   # See .env
    hostname: prod1
    user: "${VPS2_USER}"   # See .env
    role: production
    specs:
      cpu: "4 vCPU"
      ram: "16GB"
      disk: "200GB SSD"
    stacks:
      - traefik
      - website             # Teeko Site production (teeko.ai)
      - monitoring          # Grafana + Prometheus + cAdvisor + Node Exporter
      - tools               # pgadmin (pg.teeko.ai)
    notes: "Production. Teeko Site only. 4x resources of staging."

  vps3-prod:
    ssh_alias: vps3-prod
    host: "${VPS3_HOST}"   # See .env
    hostname: prod2
    user: "${VPS3_USER}"   # See .env
    role: production
    specs:
      cpu: "4 vCPU"
      ram: "16GB"
      disk: "200GB SSD"
    stacks:
      - traefik
      - n8n                 # n8n production (n8n.teeko.ai)
      - monitoring          # Grafana + Prometheus + cAdvisor + Node Exporter
    notes: "Production. n8n only. Isolated from site traffic."
