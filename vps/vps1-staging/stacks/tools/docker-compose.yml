# Deployed to VPS1 over Tailscale via infra CI (.github/workflows/deploy-infra.yml).
services:
  # Drizzle Gateway — self-hosted Drizzle Studio for managing Postgres.
  # Replaced pgAdmin. Login with MASTERPASS (from .env.gateway), then add DB
  # connections in the UI using in-network hostnames (db-site / db-n8n).
  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    pull_policy: always
    container_name: drizzle-gateway
    restart: unless-stopped
    env_file: .env.gateway          # provides MASTERPASS
    environment:
      PORT: "4983"
      STORE_PATH: "/app"            # persisted connections/session live here
    volumes:
      - drizzle-gateway-data:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`stagingpg.${BASE_DOMAIN}`)"
      - "traefik.http.routers.gateway.entrypoints=websecure"
      - "traefik.http.routers.gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.gateway.loadbalancer.server.port=4983"
    # ponytail: single network — every VPS1 stack (incl. db-site, db-n8n) is
    # already on `proxy`, so no extra network joins are needed.
    networks:
      - proxy

volumes:
  drizzle-gateway-data:

networks:
  proxy:
    external: true
