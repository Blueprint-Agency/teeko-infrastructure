# GitHub Organization Teams & Roles
# Reference document for team structure and permissions.

teams:
  - name: core
    description: "Core development team"
    privacy: closed
    permission: push # write access to repos
    members:
      - username: chriskke
        role: maintainer # org admin + devops lead
      # TODO: Add other 2 team members
      # - username: member2
      #   role: member
      # - username: member3
      #   role: member

roles:
  chriskke:
    github_role: admin
    responsibilities:
      - DevOps & infrastructure
      - CI/CD pipeline management
      - VPS administration
      - Deployment approvals (production)
    access:
      - all repos (admin)
      - VPS SSH access (all 3)
      - DockerHub push access
      - GitHub Actions secrets management
