# GitHub Organization Settings
# This is a reference document — not auto-applied.
# Use it to track desired org configuration.

organization:
  # TODO: Fill in org name after migration
  name: ""
  plan: "free" # or "team"
  default_branch: main
  default_repository_permission: read

  branch_protection:
    main:
      required_reviews: 1
      dismiss_stale_reviews: true
      require_status_checks: true
      required_checks:
        - "build"
        - "lint"
        - "test"
      enforce_admins: false
      allow_force_pushes: false
      allow_deletions: false

    staging:
      required_reviews: 0 # Allow direct push for faster iteration
      require_status_checks: true
      required_checks:
        - "build"
