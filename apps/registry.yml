n8n_instances:
  - name: n8n-dev
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      staging: vps1-staging
    port: 5678
    domain:
      staging: stagingn8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n development/staging instance"

  - name: n8n-prod
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      production: vps3-prod
    port: 5678
    domain:
      production: n8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n production instance"

mcp_servers:
  - name: ga4-mcp
    image: blueprintagency/ga4-mcp
    tags:
      production: latest
    stack: ga4-mcp
    vps:
      production: vps3-prod
    port: 8080
    domain:
      production: ga4.teeko.ai
    notes: "Google Analytics MCP (github.com/googleanalytics/google-analytics-mcp), wrapped
      with mcp-proxy (github.com/sparfenyuk/mcp-proxy) since upstream is stdio-only with no
      HTTP transport or official image. Built by .github/workflows/build-ga4-mcp.yml (no
      version pins — rerun manually to pick up upstream updates). Fronted by an OAuth 2.1
      gateway (hyprmcp mcp-gateway 0.4.0 + self-hosted Dex 2.44.0) so it works as a claude.ai
      web custom connector. Single public host ga4.teeko.ai: Dex OAuth paths (Traefik priority
      100) -> ga4-dex:5556; everything else incl. /mcp (priority 1) -> ga4-gateway:9000, which
      enforces OAuth Bearer and reverse-proxies in-network to ga4-mcp:8080/servers/<token>/mcp/.
      The ga4-mcp backend has NO public route. Client URL: https://ga4.teeko.ai/mcp. Needs a GCP
      service account with GA4 property access, key mounted at credentials/sa-key.json
      (GOOGLE_APPLICATION_CREDENTIALS + GOOGLE_PROJECT_ID)."

  - name: gsc-mcp
    image: blueprintagency/gsc-mcp
    tags:
      production: latest
    stack: gsc-mcp
    vps:
      production: vps3-prod
    port: 8080
    domain:
      production: gsc.teeko.ai
    notes: "Google Search Console MCP (github.com/AminForou/mcp-gsc, PyPI mcp-search-console),
      wrapped with mcp-proxy (upstream is stdio-only, no HTTP transport or image) and fronted by
      an OAuth 2.1 gateway (hyprmcp mcp-gateway 0.4.0 + self-hosted Dex 2.44.0) so it works as a
      claude.ai web custom connector. Single public host gsc.teeko.ai: Dex OAuth paths (Traefik
      priority 100) -> gsc-dex:5556; everything else incl. /mcp (priority 1) -> gsc-gateway:9000,
      which enforces OAuth Bearer and reverse-proxies in-network to gsc-mcp:8080/servers/<token>/mcp/.
      The gsc-mcp backend has NO public route. Client URL: https://gsc.teeko.ai/mcp. Backend image
      built by .github/workflows/build-gsc-mcp.yml (no version pins). Google auth via service account
      (reuses the ga4 SA): GSC_CREDENTIALS_PATH=/credentials/sa-key.json + GSC_SKIP_OAUTH=true; needs
      Search Console API enabled + the SA added as a user on the GSC property. Dex login via a static
      password (MCP_DEX_ADMIN_EMAIL / MCP_DEX_ADMIN_HASH, shared with ga4-mcp gateway). Secrets in
      vps3-prod env: GSC_MCP_PATH_TOKEN, GSC_MCP_SA_KEY_JSON."

tools:
  - name: pgadmin
    image: dpage/pgadmin4:latest
    stack: tools
    vps:
      - vps1-staging          # stagingpg.teeko.ai
      - vps2-prod             # pg.teeko.ai
    port: 80
    domain:
      staging: stagingpg.teeko.ai
      production: pg.teeko.ai
    notes: "Database admin UI. Keep until Supabase migration is complete."

