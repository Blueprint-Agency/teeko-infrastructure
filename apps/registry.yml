# App Registry
# Central mapping of all apps to their repos, VPS targets, and configurations.
# Update this file whenever adding/removing an app.
# Last updated: 2026-03-29

apps:
  - name: teeko-site-fe
    image: blueprintagency/teeko-website-fe
    tags:
      staging: staging
      production: latest
    stack: website
    vps:
      staging: vps1-staging
      production: vps2-prod
    port: 5000
    domain:
      staging: staging.teeko.ai
      production: teeko.ai
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko site frontend (Next.js)"

  - name: teeko-site-be
    image: blueprintagency/teeko-website-be
    tags:
      staging: staging
      production: latest
    stack: website
    vps:
      staging: vps1-staging
      production: vps2-prod
    port: 3000
    domain:
      staging: stagingapi.teeko.ai
      production: api.teeko.ai
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko site backend (Node.js)"

  - name: ehailing-be
    image: blueprintagency/ehailing-be
    tags:
      staging: staging
      production: ""           # not yet on production
    stack: ehailing
    vps:
      staging: vps3-prod       # NOTE: hosted on prod VPS3 even in staging phase
      production: ""
    port: 3000
    domain:
      staging: ehailingapi.teeko.ai
    db: supabase
    notes: "Teeko e-hailing backend (Fastify + Drizzle). Built from teeko-ehailing/apps/backend, staging branch. Uses dedicated ehailing-network."

  - name: booking-be
    image: blueprintagency/booking-be
    tags:
      staging: staging
      production: latest
    stack: booking-staging / booking-prod
    vps:
      staging: bpvps2
      production: bpvps2
    port: 4000
    domain:
      staging: bookingapi.teeko.ai
      production: prodbookingapi.teeko.ai
    db: local-postgres
    notes: "Yoga Sadhana booking-system backend (Hono + Drizzle + Postgres). Built from
      booking-system/be by that repo's deploy-be.yml: staging branch -> booking-staging
      stack, main branch -> booking-prod stack. BOTH instances live on bpvps2, sharing
      only Traefik — separate containers, volumes, networks and databases keyed off
      ENV_NAME in the shared compose file.
      Migrated off vps3-prod on 2026-07-21; staging carries the original data, prod
      started empty. NOTE: staging holds the bookingapi.teeko.ai name because it was
      the only instance until the split — swap the two domains at real prod launch,
      and repoint the Clerk/Stripe webhooks when you do."

  - name: kaiteki-web
    image: blueprintagency/kaiteki-web
    tags:
      staging: staging
      production: ""           # TODO: cut over kaiteki.my from the legacy kaiteki-main-old stack
    stack: kaiteki-staging
    vps:
      staging: bpvps1          # 4th VPS (187.127.122.41), alongside the legacy kaiteki stack
      production: ""
    port: 3000
    domain:
      staging: staging.kaiteki.my
    db: null
    notes: "Revamped Kaiteki site (Next.js 16, standalone). Built from Blueprint-Agency/kaiteki-web,
      staging branch, by that repo's deploy-staging.yml (app-managed stack). staging.kaiteki.my is on
      a separate Cloudflare account (proxied, Full) → Traefik default cert, no LE DNS-01. Replaces the
      legacy blueprintagency/kaiteki-main-old at kaiteki.my once the prod cutover happens."

n8n_instances:
  - name: n8n-dev
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      staging: vps1-staging
    port: 5678
    domain:
      staging: stagingn8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n development/staging instance"

  - name: n8n-prod
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      production: vps3-prod
    port: 5678
    domain:
      production: n8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n production instance"

mcp_servers:
  - name: ga4-mcp
    image: blueprintagency/ga4-mcp
    tags:
      production: latest
    stack: ga4-mcp
    vps:
      production: vps3-prod
    port: 8080
    domain:
      production: ga4.teeko.ai
    notes: "Google Analytics MCP (github.com/googleanalytics/google-analytics-mcp), wrapped
      with mcp-proxy (github.com/sparfenyuk/mcp-proxy) since upstream is stdio-only with no
      HTTP transport or official image. Built by .github/workflows/build-ga4-mcp.yml (no
      version pins — rerun manually to pick up upstream updates). Fronted by an OAuth 2.1
      gateway (hyprmcp mcp-gateway 0.4.0 + self-hosted Dex 2.44.0) so it works as a claude.ai
      web custom connector. Single public host ga4.teeko.ai: Dex OAuth paths (Traefik priority
      100) -> ga4-dex:5556; everything else incl. /mcp (priority 1) -> ga4-gateway:9000, which
      enforces OAuth Bearer and reverse-proxies in-network to ga4-mcp:8080/servers/<token>/mcp/.
      The ga4-mcp backend has NO public route. Client URL: https://ga4.teeko.ai/mcp. Needs a GCP
      service account with GA4 property access, key mounted at credentials/sa-key.json
      (GOOGLE_APPLICATION_CREDENTIALS + GOOGLE_PROJECT_ID)."

  - name: gsc-mcp
    image: blueprintagency/gsc-mcp
    tags:
      production: latest
    stack: gsc-mcp
    vps:
      production: vps3-prod
    port: 8080
    domain:
      production: gsc.teeko.ai
    notes: "Google Search Console MCP (github.com/AminForou/mcp-gsc, PyPI mcp-search-console),
      wrapped with mcp-proxy (upstream is stdio-only, no HTTP transport or image) and fronted by
      an OAuth 2.1 gateway (hyprmcp mcp-gateway 0.4.0 + self-hosted Dex 2.44.0) so it works as a
      claude.ai web custom connector. Single public host gsc.teeko.ai: Dex OAuth paths (Traefik
      priority 100) -> gsc-dex:5556; everything else incl. /mcp (priority 1) -> gsc-gateway:9000,
      which enforces OAuth Bearer and reverse-proxies in-network to gsc-mcp:8080/servers/<token>/mcp/.
      The gsc-mcp backend has NO public route. Client URL: https://gsc.teeko.ai/mcp. Backend image
      built by .github/workflows/build-gsc-mcp.yml (no version pins). Google auth via service account
      (reuses the ga4 SA): GSC_CREDENTIALS_PATH=/credentials/sa-key.json + GSC_SKIP_OAUTH=true; needs
      Search Console API enabled + the SA added as a user on the GSC property. Dex login via a static
      password (MCP_DEX_ADMIN_EMAIL / MCP_DEX_ADMIN_HASH, shared with ga4-mcp gateway). Secrets in
      vps3-prod env: GSC_MCP_PATH_TOKEN, GSC_MCP_SA_KEY_JSON."

tools:
  - name: drizzle-gateway
    image: ghcr.io/drizzle-team/gateway:latest
    stack: tools
    vps:
      - vps1-staging          # stagingpg.teeko.ai — reaches db-site / db-n8n
      - vps2-prod             # pg.teeko.ai        — reaches db-site
      - vps3-prod             # pg3.teeko.ai       — reaches db-ehailing / db-booking
    port: 4983
    domain:
      staging: stagingpg.teeko.ai
      production: pg.teeko.ai
      production_vps3: pg3.teeko.ai
    notes: "Self-hosted Drizzle Studio. Replaced pgAdmin on all 3 Teeko VPS. Login with
      MASTERPASS (GATEWAY_MASTERPASS secret, shared by all three), then add DB connections
      in the UI by in-network hostname."

