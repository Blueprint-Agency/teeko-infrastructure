# App Registry
# Central mapping of all apps to their repos, VPS targets, and configurations.
# Update this file whenever adding/removing an app.
# Last updated: 2026-03-29

apps:
  - name: teeko-site-fe
    image: blueprintagency/teeko-website-fe
    tags:
      staging: staging
      production: latest
    stack: website
    vps:
      staging: vps1-staging
      production: vps2-prod
    port: 5000
    domain:
      staging: staging.teeko.ai
      production: teeko.ai
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko site frontend (Next.js)"

  - name: teeko-site-be
    image: blueprintagency/teeko-website-be
    tags:
      staging: staging
      production: latest
    stack: website
    vps:
      staging: vps1-staging
      production: vps2-prod
    port: 3000
    domain:
      staging: stagingapi.teeko.ai
      production: api.teeko.ai
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko site backend (Node.js)"

  - name: teeko-webapp-fe
    image: chriskke/teeko-webapp-fe   # TODO: move to blueprintagency org
    tags:
      staging: staging
      production: ""          # not yet on production
    stack: webapp
    vps:
      staging: vps1-staging
      production: ""          # TODO: assign VPS when ready
    port: 5173
    domain:
      staging: ""             # TODO: fill in domain
    db: null
    notes: "Teeko webapp frontend (Next.js). Staging only."

  - name: teeko-webapp-be
    image: chriskke/teeko-webapp-be   # TODO: move to blueprintagency org
    tags:
      staging: staging
      production: ""          # not yet on production
    stack: webapp
    vps:
      staging: vps1-staging
      production: ""          # TODO: assign VPS when ready
    port: 3000
    domain:
      staging: ""             # TODO: fill in domain
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko webapp backend (Node.js). Staging only."

  - name: ehailing-be
    image: blueprintagency/ehailing-be
    tags:
      staging: staging
      production: ""           # not yet on production
    stack: ehailing
    vps:
      staging: vps3-prod       # NOTE: hosted on prod VPS3 even in staging phase
      production: ""
    port: 3000
    domain:
      staging: ehailingapi.teeko.ai
    db: supabase
    notes: "Teeko e-hailing backend (Fastify + Drizzle). Built from teeko-ehailing/apps/backend, staging branch. Uses dedicated ehailing-network."

  - name: booking-be
    image: blueprintagency/booking-be
    tags:
      staging: ""              # no staging branch yet
      production: latest
    stack: booking-system
    vps:
      staging: ""
      production: vps3-prod
    port: 4000
    domain:
      production: bookingapi.teeko.ai
    db: local-postgres
    notes: "Yoga Sadhana booking-system backend (Hono + Drizzle + Postgres). Built from booking-system/be, main branch. Uses dedicated booking-network."

n8n_instances:
  - name: n8n-dev
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      staging: vps1-staging
    port: 5678
    domain:
      staging: stagingn8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n development/staging instance"

  - name: n8n-prod
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      production: vps3-prod
    port: 5678
    domain:
      production: n8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n production instance"

tools:
  - name: pgadmin
    image: dpage/pgadmin4:latest
    stack: tools
    vps:
      - vps1-staging          # stagingpg.teeko.ai
      - vps2-prod             # pg.teeko.ai
    port: 80
    domain:
      staging: stagingpg.teeko.ai
      production: pg.teeko.ai
    notes: "Database admin UI. Keep until Supabase migration is complete."

# Already removed (migration complete):
# - portainer / portainer_agent (replaced by Claude Code + MCP)
# - watchtower (replaced by GHA-triggered deploys)
# - nginx-proxy-manager (replaced by Traefik on all 3 VPS)
