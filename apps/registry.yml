# App Registry
# Central mapping of all apps to their repos, VPS targets, and configurations.
# Update this file whenever adding/removing an app.
# Audited from running containers on 2026-03-28.

apps:
  - name: teeko-site-fe
    image: chriskke/teeko-site-fe
    tags:
      staging: staging
      production: latest
    vps:
      staging: staging       # VPS1
      production: prod-vps2  # VPS2
    port: 80
    domain: "" # TODO: fill in domain
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko site frontend (Next.js)"

  - name: teeko-site-be
    image: chriskke/teeko-site-be
    tags:
      staging: staging
      production: latest
    vps:
      staging: staging
      production: prod-vps2
    port: 3000
    domain: "" # TODO: fill in domain
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko site backend (Node.js)"

  - name: teeko-webapp-fe
    image: chriskke/teeko-webapp-fe
    tags:
      staging: staging
      production: "" # TODO: not yet on production
    vps:
      staging: staging
      production: "" # TODO: assign VPS when ready
    port: 5173
    domain: "" # TODO: fill in domain
    db: null
    notes: "Teeko webapp frontend (Next.js). Currently staging only."

  - name: teeko-webapp-be
    image: chriskke/teeko-webapp-be
    tags:
      staging: staging
      production: "" # TODO: not yet on production
    vps:
      staging: staging
      production: "" # TODO: assign VPS when ready
    port: 3000
    domain: "" # TODO: fill in domain
    db: local-postgres       # TODO: migrate to Supabase
    notes: "Teeko webapp backend (Node.js). Currently staging only."

n8n_instances:
  - name: n8n-dev
    image: n8nio/n8n:latest
    vps:
      staging: staging       # VPS1
    port: 5678
    domain: "" # TODO: fill in domain
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n development/staging instance"

  - name: n8n-prod
    image: n8nio/n8n:latest
    vps:
      production: prod-vps3  # VPS3
    port: 5678
    domain: "" # TODO: fill in domain
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n production instance"

tools:
  - name: pgadmin
    image: dpage/pgadmin4:latest
    vps:
      - staging       # VPS1
      - prod-vps2     # VPS2
    port: 80
    notes: "Database admin UI. Keep until Supabase migration is complete."

# To be removed during migration:
# - portainer / portainer_agent (replaced by Claude Code + MCP)
# - watchtower (replaced by GHA-triggered deploys)
# - nginx-proxy-manager (replaced by Traefik)
