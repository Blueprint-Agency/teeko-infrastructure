  - name: booking-be
    image: blueprintagency/booking-be
    tags:
      staging: ""              # no staging branch yet
      production: latest
    stack: booking-system
    vps:
      staging: ""
      production: vps3-prod
    port: 4000
    domain:
      production: bookingapi.teeko.ai
    db: local-postgres
    notes: "Yoga Sadhana booking-system backend (Hono + Drizzle + Postgres). Built from booking-system/be, main branch. Uses dedicated booking-network."

n8n_instances:
  - name: n8n-dev
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      staging: vps1-staging
    port: 5678
    domain:
      staging: stagingn8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n development/staging instance"

  - name: n8n-prod
    image: n8nio/n8n:latest
    stack: n8n
    vps:
      production: vps3-prod
    port: 5678
    domain:
      production: n8n.teeko.ai
    db: local-postgres       # n8n requires local Postgres, not Supabase
    notes: "n8n production instance"

mcp_servers:
  - name: ga4-mcp
    image: blueprintagency/ga4-mcp
    tags:
      production: latest
    stack: ga4-mcp
    vps:
      production: vps3-prod
    port: 8080
    domain:
      production: ga4.teeko.ai
    notes: "Google Analytics MCP (github.com/googleanalytics/google-analytics-mcp), wrapped
      with mcp-proxy (github.com/sparfenyuk/mcp-proxy) since upstream is stdio-only with no
      HTTP transport or official image. Built by .github/workflows/build-ga4-mcp.yml (no
      version pins — rerun manually to pick up upstream updates). Access control is a
      secret path, not Traefik auth (Claude.ai's custom-connector UI takes a URL only, no
      headers): mcp-proxy --named-server mounts at /servers/<GA4_MCP_PATH_TOKEN>/, full
      client URL is https://ga4.teeko.ai/servers/<token>/sse. /status is blocked at Traefik
      since it would otherwise echo the token back. Needs a GCP service account with GA4
      property access, key mounted at credentials/sa-key.json (GOOGLE_APPLICATION_CREDENTIALS
      + GOOGLE_PROJECT_ID)."

tools:
  - name: pgadmin
    image: dpage/pgadmin4:latest
    stack: tools
    vps:
      - vps1-staging          # stagingpg.teeko.ai
      - vps2-prod             # pg.teeko.ai
    port: 80
    domain:
      staging: stagingpg.teeko.ai
      production: pg.teeko.ai
    notes: "Database admin UI. Keep until Supabase migration is complete."

