name: Deploy Infrastructure Stacks

# Repo is source of truth for all stacks, on ALL hosts listed in vps/hosts.json.
# On push to main:
#   - Stack folder present + changed  → deploy / update on the host
#   - Stack folder deleted from repo  → docker compose down + remove from the host
#
# Per-host behaviour lives in vps/hosts.json, not here:
#   exclude     stacks skipped entirely (managed by their own repo CI/CD)
#   app_stacks  compose is rsynced, but `docker compose up` is the app repo's job
#   fanout      one repo stack dir → several host stack dirs (bpvps2's booking)
#
# Each host needs a GitHub Environment named after its `key`, holding at minimum
# TAILSCALE_HOST. BASE_DOMAIN / ACME_EMAIL / CF_DNS_API_TOKEN are org-level;
# override them per Environment where a host differs (bpvps1 → kaiteki.my).

on:
  push:
    branches: [main]
    paths:
      - 'vps/**'
      - '.github/workflows/deploy-infra.yml'

jobs:
  # ── Map changed paths → host entries from vps/hosts.json ─────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.out.outputs.hosts }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: out
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          printf '%s\n' "$DIFF" > /tmp/diff.txt
          HOSTS=$(python3 vps/shared/select-hosts.py /tmp/diff.txt)
          echo "hosts=$HOSTS" >> $GITHUB_OUTPUT
          echo "Selected: $HOSTS"

  # ── One job, fanned out over the hosts detect selected ───────────────────────
  deploy:
    needs: detect
    if: needs.detect.outputs.hosts != '[]'
    runs-on: ubuntu-latest
    environment: ${{ matrix.host.key }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.detect.outputs.hosts) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.TAILSCALE_HOST }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.TAILSCALE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Detect stacks to deploy and remove
        id: stacks
        env:
          DIR: ${{ matrix.host.dir }}
          EXCLUDE: ${{ matrix.host.exclude }}
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          EXPR=$(echo "$EXCLUDE" | tr ' ' '|')
          [ -z "$EXPR" ] && EXPR='^$'
          ALL_TOUCHED=$(echo "$DIFF" | grep "^$DIR/stacks/" \
            | sed "s|$DIR/stacks/||;s|/.*||" | sort -u \
            | grep -vxE "$EXPR" || true)
          DEPLOY="" REMOVE=""
          for stack in $ALL_TOUCHED; do
            if [ -d "$DIR/stacks/$stack" ]; then DEPLOY="$DEPLOY $stack"; else REMOVE="$REMOVE $stack"; fi
          done
          echo "deploy=$(echo $DEPLOY | xargs)" >> $GITHUB_OUTPUT
          echo "remove=$(echo $REMOVE | xargs)" >> $GITHUB_OUTPUT
          echo "Deploy: $DEPLOY | Remove: $REMOVE"

      - name: Sync compose files
        if: steps.stacks.outputs.deploy != ''
        env:
          DIR: ${{ matrix.host.dir }}
          SSH_HOST: ${{ vars.TAILSCALE_HOST }}
          FANOUT: ${{ toJSON(matrix.host.fanout) }}
          DEPLOY: ${{ steps.stacks.outputs.deploy }}
        run: |
          RSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no"
          python3 vps/shared/expand-targets.py $DEPLOY | while IFS='|' read -r d env_name stack; do
            echo "=== syncing $stack -> /root/stacks/$d"
            rsync -rltz --exclude='.env' --exclude='.env.*' -e "$RSH" \
              "$DIR/stacks/$stack/" "deploy@$SSH_HOST:/root/stacks/$d/"
          done

      - name: Deploy and remove stacks
        if: steps.stacks.outputs.deploy != '' || steps.stacks.outputs.remove != ''
        env:
          SSH_HOST: ${{ vars.TAILSCALE_HOST }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
          GATEWAY_MASTERPASS: ${{ secrets.GATEWAY_MASTERPASS }}
          GA4_MCP_PATH_TOKEN: ${{ secrets.GA4_MCP_PATH_TOKEN }}
          GA4_MCP_SA_KEY_JSON: ${{ secrets.GA4_MCP_SA_KEY_JSON }}
          GA4_MCP_PROJECT_ID: ${{ vars.GA4_MCP_PROJECT_ID }}
          GSC_MCP_PATH_TOKEN: ${{ secrets.GSC_MCP_PATH_TOKEN }}
          GSC_MCP_SA_KEY_JSON: ${{ secrets.GSC_MCP_SA_KEY_JSON }}
          MCP_DEX_ADMIN_HASH: ${{ secrets.MCP_DEX_ADMIN_HASH }}
          MCP_DEX_ADMIN_EMAIL: ${{ vars.MCP_DEX_ADMIN_EMAIL }}
          N8N_DB_USER: ${{ vars.N8N_DB_USER }}
          N8N_DB_PASSWORD: ${{ secrets.N8N_DB_PASSWORD }}
          N8N_DB_NAME: ${{ vars.N8N_DB_NAME }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_EDITOR_BASE_URL: ${{ vars.N8N_EDITOR_BASE_URL }}
          N8N_WEBHOOK_URL: ${{ vars.N8N_WEBHOOK_URL }}
          ENV_NAME: ${{ matrix.host.env_name }}
          FANOUT: ${{ toJSON(matrix.host.fanout) }}
          DEPLOY: ${{ steps.stacks.outputs.deploy }}
          REMOVE: ${{ steps.stacks.outputs.remove }}
        run: |
          ESCAPED_AUTH=$(printf '%s' "$TRAEFIK_DASHBOARD_AUTH" | sed 's/\$/\$\$/g')

          BASE_ENV=$(printf 'BASE_DOMAIN=%s\nACME_EMAIL=%s\nCF_DNS_API_TOKEN=%s\nTRAEFIK_DASHBOARD_AUTH=%s\nGA4_MCP_PATH_TOKEN=%s\nENV_NAME=%s\n' \
            "$BASE_DOMAIN" "$ACME_EMAIL" "$CF_DNS_API_TOKEN" "$ESCAPED_AUTH" "$GA4_MCP_PATH_TOKEN" "$ENV_NAME" | base64 -w0)

          # GOOGLE_APPLICATION_CREDENTIALS path matches where the sa-key.json is written below
          GA4_ENV=$(printf 'GOOGLE_APPLICATION_CREDENTIALS=%s\nGOOGLE_PROJECT_ID=%s\n' \
            "/credentials/sa-key.json" "$GA4_MCP_PROJECT_ID" | base64 -w0)

          GA4_SA_KEY=$(printf '%s' "$GA4_MCP_SA_KEY_JSON" | base64 -w0)

          GSC_ENV=$(printf 'GSC_CREDENTIALS_PATH=%s\nGSC_SKIP_OAUTH=%s\n' \
            "/credentials/sa-key.json" "true" | base64 -w0)

          GSC_SA_KEY=$(printf '%s' "$GSC_MCP_SA_KEY_JSON" | base64 -w0)

          # Full gateway-config.yaml, token substituted as a printf ARG (literal, no shell expansion).
          GSC_GATEWAY_CFG=$(printf 'host: https://gsc.%s/\nauthorization:\n  server: http://gsc-dex:5556/\n  authorizationProxyEnabled: true\n  serverMetadataProxyEnabled: true\n  dynamicClientRegistration:\n    enabled: true\n    publicClient: true\ndexGRPCClient:\n  addr: gsc-dex:5557\nproxy:\n  - path: /mcp\n    http:\n      url: http://gsc-mcp:8080/servers/%s/mcp/\n    authentication:\n      enabled: true\n' \
            "$BASE_DOMAIN" "$GSC_MCP_PATH_TOKEN" | base64 -w0)

          # Full dex-config.yaml; email + bcrypt hash passed as printf ARGs so the $ in the
          # hash stays literal. block-style allowedOrigins avoids quoting a flow sequence.
          GSC_DEX_CFG=$(printf 'issuer: https://gsc.%s\nweb:\n  http: 0.0.0.0:5556\n  allowedOrigins:\n    - "*"\ngrpc:\n  addr: 0.0.0.0:5557\nstorage:\n  type: sqlite3\n  config:\n    file: /var/dex/dex.db\noauth2:\n  skipApprovalScreen: true\nexpiry:\n  idTokens: "8760h"\n  refreshTokens:\n    disableRotation: true\n    validIfNotUsedFor: "87600h"\n    absoluteLifetime: "87600h"\nenablePasswordDB: true\nstaticPasswords:\n  - email: "%s"\n    hash: "%s"\n    username: admin\n    userID: "7f3a1e2c-9b4d-4a6e-8c1f-2d5b7e9a0c34"\n' \
            "$BASE_DOMAIN" "$MCP_DEX_ADMIN_EMAIL" "$MCP_DEX_ADMIN_HASH" | base64 -w0)

          GA4_GATEWAY_CFG=$(printf 'host: https://ga4.%s/\nauthorization:\n  server: http://ga4-dex:5556/\n  authorizationProxyEnabled: true\n  serverMetadataProxyEnabled: true\n  dynamicClientRegistration:\n    enabled: true\n    publicClient: true\ndexGRPCClient:\n  addr: ga4-dex:5557\nproxy:\n  - path: /mcp\n    http:\n      url: http://ga4-mcp:8080/servers/%s/mcp/\n    authentication:\n      enabled: true\n' \
            "$BASE_DOMAIN" "$GA4_MCP_PATH_TOKEN" | base64 -w0)

          GA4_DEX_CFG=$(printf 'issuer: https://ga4.%s\nweb:\n  http: 0.0.0.0:5556\n  allowedOrigins:\n    - "*"\ngrpc:\n  addr: 0.0.0.0:5557\nstorage:\n  type: sqlite3\n  config:\n    file: /var/dex/dex.db\noauth2:\n  skipApprovalScreen: true\nexpiry:\n  idTokens: "8760h"\n  refreshTokens:\n    disableRotation: true\n    validIfNotUsedFor: "87600h"\n    absoluteLifetime: "87600h"\nenablePasswordDB: true\nstaticPasswords:\n  - email: "%s"\n    hash: "%s"\n    username: admin\n    userID: "7ea943f4-f0d5-4af2-a386-fc20eacb2ff1"\n' \
            "$BASE_DOMAIN" "$MCP_DEX_ADMIN_EMAIL" "$MCP_DEX_ADMIN_HASH" | base64 -w0)

          N8N_APP_ENV=$(printf '%s\n' \
            "DB_TYPE=postgresdb" "DB_POSTGRESDB_HOST=db-n8n" "DB_POSTGRESDB_PORT=5432" \
            "DB_POSTGRESDB_USER=$N8N_DB_USER" "DB_POSTGRESDB_PASSWORD=$N8N_DB_PASSWORD" \
            "DB_POSTGRESDB_DATABASE=$N8N_DB_NAME" "DB_POSTGRESDB_SCHEMA=public" \
            "N8N_ENCRYPTION_KEY=$N8N_ENCRYPTION_KEY" "N8N_PORT=5678" \
            "N8N_EDITOR_BASE_URL=$N8N_EDITOR_BASE_URL" "WEBHOOK_URL=$N8N_WEBHOOK_URL" \
            "N8N_SECURE_COOKIE=false" "N8N_RUNNERS_ENABLED=true" \
            "N8N_DIAGNOSTICS_ENABLED=false" "N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true" \
            "N8N_DEFAULT_BINARY_DATA_MODE=filesystem" "NODE_FUNCTION_ALLOW_BUILTIN=crypto" \
            "GENERIC_TIMEZONE=Asia/Kuala_Lumpur" "TZ=Asia/Kuala_Lumpur" | base64 -w0)

          N8N_DB_ENV=$(printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\n' \
            "$N8N_DB_USER" "$N8N_DB_PASSWORD" "$N8N_DB_NAME" | base64 -w0)

          GATEWAY_ENV=$(printf 'MASTERPASS=%s\n' "$GATEWAY_MASTERPASS" | base64 -w0)

          # Expand stack names into dir|env_name|stack targets (fanout-aware).
          TARGETS=$(python3 vps/shared/expand-targets.py $DEPLOY | tr '\n' ' ')
          REMOVE_TARGETS=$(python3 vps/shared/expand-targets.py $REMOVE | tr '\n' ' ')
          echo "Targets: $TARGETS"
          echo "Remove:  $REMOVE_TARGETS"

          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no "deploy@$SSH_HOST" "
          set -e
          TARGETS='$TARGETS'
          REMOVE_TARGETS='$REMOVE_TARGETS'
          BASE_ENV='$BASE_ENV'
          GATEWAY_ENV='$GATEWAY_ENV'
          GA4_ENV='$GA4_ENV'
          GA4_SA_KEY='$GA4_SA_KEY'
          N8N_APP_ENV='$N8N_APP_ENV'
          N8N_DB_ENV='$N8N_DB_ENV'
          GSC_ENV='$GSC_ENV'
          GSC_SA_KEY='$GSC_SA_KEY'
          GSC_GATEWAY_CFG='$GSC_GATEWAY_CFG'
          GSC_DEX_CFG='$GSC_DEX_CFG'
          GSC_MCP_PATH_TOKEN='$GSC_MCP_PATH_TOKEN'
          GA4_GATEWAY_CFG='$GA4_GATEWAY_CFG'
          GA4_DEX_CFG='$GA4_DEX_CFG'

          # App-managed stacks: infra rsyncs the compose file but the app's own
          # workflow writes .env.* and runs 'docker compose up'. Skip the up here.
          APP_STACKS='${{ matrix.host.app_stacks }}'

          # TARGETS entries are dir|env_name|stack. dir == stack everywhere except
          # bpvps2's booking: one repo stack deployed into two host dirs, each
          # carrying its own env_name.
          for target in \$TARGETS; do
            dir=\$(echo \"\$target\" | cut -d'|' -f1)
            env_name=\$(echo \"\$target\" | cut -d'|' -f2)
            stack=\$(echo \"\$target\" | cut -d'|' -f3)
            echo '=== Deploying '\$stack' -> /root/stacks/'\$dir' (ENV_NAME='\$env_name') ==='
            mkdir -p /root/stacks/\$dir

            # MERGE, never replace. Stacks carry host-managed keys CI knows nothing
            # about (stalwart's mail secrets, booking's BOOKING_HOST/IMAGE_TAG).
            # CI-owned keys win; every other line, comments included, is preserved.
            NEW_ENV=\$(mktemp); KEPT=\$(mktemp)
            { echo \"\$BASE_ENV\" | base64 -d; echo \"ENV_NAME=\$env_name\"; } > \$NEW_ENV
            if [ -f /root/stacks/\$dir/.env ]; then
              awk -F= 'NR==FNR { if (\$0 ~ /^[A-Za-z_][A-Za-z0-9_]*=/) { split(\$0,a,\"=\"); k[a[1]]=1 } next }
                       /^[A-Za-z_][A-Za-z0-9_]*=/ { split(\$0,a,\"=\"); if (a[1] in k) next }
                       { print }' \$NEW_ENV /root/stacks/\$dir/.env > \$KEPT
              cat \$NEW_ENV \$KEPT > /root/stacks/\$dir/.env
            else
              cp \$NEW_ENV /root/stacks/\$dir/.env
            fi
            rm -f \$NEW_ENV \$KEPT

            if echo \" \$APP_STACKS \" | grep -q \" \$dir \"; then
              echo \"=== \$dir compose synced; up handled by app workflow ===\"
              continue
            fi
            case \$stack in
              n8n)
                echo \"\$N8N_APP_ENV\" | base64 -d > /root/stacks/\$dir/.env.n8n
                echo \"\$N8N_DB_ENV\"  | base64 -d > /root/stacks/\$dir/.env.db-n8n ;;
              tools)
                echo \"\$GATEWAY_ENV\" | base64 -d > /root/stacks/\$dir/.env.gateway ;;
              ga4-mcp)
                mkdir -p /root/stacks/\$dir/credentials /root/stacks/\$dir/dex-data
                echo \"\$GA4_SA_KEY\" | base64 -d > /root/stacks/\$dir/credentials/sa-key.json
                chmod 644 /root/stacks/\$dir/credentials/sa-key.json
                echo \"\$GA4_ENV\"    | base64 -d > /root/stacks/\$dir/.env.ga4-mcp
                echo \"\$GA4_GATEWAY_CFG\" | base64 -d > /root/stacks/\$dir/gateway-config.yaml
                echo \"\$GA4_DEX_CFG\"     | base64 -d > /root/stacks/\$dir/dex-config.yaml
                chown -R 1001:1001 /root/stacks/\$dir/dex-data ;;
              gsc-mcp)
                mkdir -p /root/stacks/\$dir/credentials
                echo \"\$GSC_SA_KEY\"      | base64 -d > /root/stacks/\$dir/credentials/sa-key.json
                chmod 644 /root/stacks/\$dir/credentials/sa-key.json
                echo \"\$GSC_ENV\"         | base64 -d > /root/stacks/\$dir/.env.gsc-mcp
                echo \"GSC_MCP_PATH_TOKEN=\$GSC_MCP_PATH_TOKEN\" >> /root/stacks/\$dir/.env
                echo \"\$GSC_GATEWAY_CFG\" | base64 -d > /root/stacks/\$dir/gateway-config.yaml
                echo \"\$GSC_DEX_CFG\"     | base64 -d > /root/stacks/\$dir/dex-config.yaml
                mkdir -p /root/stacks/\$dir/dex-data
                chown -R 1001:1001 /root/stacks/\$dir/dex-data ;;
            esac
            cd /root/stacks/\$dir
            docker compose up -d --remove-orphans
            docker image prune -af
            echo '=== '\$dir' done ==='
          done

          for target in \$REMOVE_TARGETS; do
            dir=\$(echo \"\$target\" | cut -d'|' -f1)
            echo '=== Removing '\$dir' ==='
            if [ -d /root/stacks/\$dir ]; then
              cd /root/stacks/\$dir && docker compose down --remove-orphans
              rm -rf /root/stacks/\$dir
            fi
            echo '=== '\$dir' removed ==='
          done
          "
