          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Detect changed infra stacks
        id: stacks
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          ALL=$(echo "$DIFF" | grep '^vps/vps2-prod/stacks/' \
            | sed 's|vps/vps2-prod/stacks/||;s|/.*||' | sort -u | tr '\n' ' ')
          FILTERED=$(echo "$ALL" | tr ' ' '\n' \
            | grep -xE 'traefik|monitoring|tools' | tr '\n' ' ')
          echo "changed=$FILTERED" >> $GITHUB_OUTPUT
          echo "Stacks to deploy: $FILTERED"

      - name: Sync compose files
        if: steps.stacks.outputs.changed != ''
        run: |
          rsync -rltz \
            --exclude='.env' --exclude='.env.*' \
            -e "ssh -i ~/.ssh/id_deploy" \
            vps/vps2-prod/stacks/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/stacks/"

      - name: Write env files and deploy
        if: steps.stacks.outputs.changed != ''
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          PGADMIN_DEFAULT_EMAIL: ${{ vars.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          STACKS: ${{ steps.stacks.outputs.changed }}
        run: |
          ESCAPED_AUTH=$(printf '%s' "$TRAEFIK_DASHBOARD_AUTH" | sed 's/\$/\$\$/g')

          BASE_ENV=$(printf 'BASE_DOMAIN=%s\nACME_EMAIL=%s\nCF_DNS_API_TOKEN=%s\nTRAEFIK_DASHBOARD_AUTH=%s\nGRAFANA_ADMIN_PASSWORD=%s\n' \
            "$BASE_DOMAIN" "$ACME_EMAIL" "$CF_DNS_API_TOKEN" "$ESCAPED_AUTH" "$GRAFANA_ADMIN_PASSWORD" | base64 -w0)

          PGADMIN_ENV=$(printf 'PGADMIN_DEFAULT_EMAIL=%s\nPGADMIN_DEFAULT_PASSWORD=%s\nPGADMIN_CONFIG_SERVER_MODE=True\nPGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False\n' \
            "$PGADMIN_DEFAULT_EMAIL" "$PGADMIN_DEFAULT_PASSWORD" | base64 -w0)

          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
          set -e
          STACKS='$STACKS'
          BASE_ENV='$BASE_ENV'
          PGADMIN_ENV='$PGADMIN_ENV'

          for stack in \$STACKS; do
            echo '=== Deploying '\$stack' ==='
            mkdir -p /root/stacks/\$stack
            echo \"\$BASE_ENV\" | base64 -d > /root/stacks/\$stack/.env
            case \$stack in
              tools)
                echo \"\$PGADMIN_ENV\" | base64 -d > /root/stacks/tools/.env.pgadmin ;;
            esac
            cd /root/stacks/\$stack
            docker compose up -d --remove-orphans
            echo '=== '\$stack' done ==='
          done
          "

  # ── VPS3 Production: traefik, monitoring, n8n ─────────────────────────────────
  deploy-vps3:
    needs: detect
    if: needs.detect.outputs.vps3 == 'true'
    environment: vps3-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
