name: Deploy Infrastructure Stacks

# Repo is source of truth for all stacks.
# On push to main:
#   - Stack folder present + changed  → deploy / update on VPS
#   - Stack folder deleted from repo  → docker compose down + remove from VPS
#
# Excluded from automation (managed by their own repo CI/CD):
#   VPS1: website, webapp
#   VPS2: website
#   VPS3: (nothing excluded)
#
# Secrets live in GitHub Environments: vps1-staging, vps2-prod, vps3-prod

on:
  push:
    branches: [main]
    paths:
      - 'vps/vps1-staging/**'
      - 'vps/vps2-prod/**'
      - 'vps/vps3-prod/**'

jobs:
  # ── Detect which VPS directories changed ─────────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      vps1: ${{ steps.out.outputs.vps1 }}
      vps2: ${{ steps.out.outputs.vps2 }}
      vps3: ${{ steps.out.outputs.vps3 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: out
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          echo "vps1=$(echo "$DIFF" | grep -qE '^vps/vps1-staging/' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "vps2=$(echo "$DIFF" | grep -qE '^vps/vps2-prod/'    && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "vps3=$(echo "$DIFF" | grep -qE '^vps/vps3-prod/'    && echo true || echo false)" >> $GITHUB_OUTPUT

  # ── VPS1 Staging ─────────────────────────────────────────────────────────────
  deploy-vps1:
    needs: detect
    if: needs.detect.outputs.vps1 == 'true'
    environment: vps1-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Detect stacks to deploy and remove
        id: stacks
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          EXCLUDE='website|webapp'
          ALL_TOUCHED=$(echo "$DIFF" | grep '^vps/vps1-staging/stacks/' \
            | sed 's|vps/vps1-staging/stacks/||;s|/.*||' | sort -u \
            | grep -vxE "$EXCLUDE" || true)
          DEPLOY="" REMOVE=""
          for stack in $ALL_TOUCHED; do
            if [ -d "vps/vps1-staging/stacks/$stack" ]; then
              DEPLOY="$DEPLOY $stack"
            else
              REMOVE="$REMOVE $stack"
            fi
          done
          DEPLOY=$(echo $DEPLOY | xargs); REMOVE=$(echo $REMOVE | xargs)
          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT
          echo "remove=$REMOVE" >> $GITHUB_OUTPUT
          echo "Deploy: $DEPLOY | Remove: $REMOVE"

      - name: Sync compose files
        if: steps.stacks.outputs.deploy != ''
        run: |
          rsync -rltz \
            --exclude='.env' --exclude='.env.*' \
            -e "ssh -i ~/.ssh/id_deploy" \
            vps/vps1-staging/stacks/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/stacks/"

      - name: Deploy and remove stacks
        if: steps.stacks.outputs.deploy != '' || steps.stacks.outputs.remove != ''
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
          PGADMIN_DEFAULT_EMAIL: ${{ vars.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          N8N_DB_USER: ${{ vars.N8N_DB_USER }}
          N8N_DB_PASSWORD: ${{ secrets.N8N_DB_PASSWORD }}
          N8N_DB_NAME: ${{ vars.N8N_DB_NAME }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_EDITOR_BASE_URL: ${{ vars.N8N_EDITOR_BASE_URL }}
          N8N_WEBHOOK_URL: ${{ vars.N8N_WEBHOOK_URL }}
          DEPLOY: ${{ steps.stacks.outputs.deploy }}
          REMOVE: ${{ steps.stacks.outputs.remove }}
        run: |
          ESCAPED_AUTH=$(printf '%s' "$TRAEFIK_DASHBOARD_AUTH" | sed 's/\$/\$\$/g')

          BASE_ENV=$(printf 'BASE_DOMAIN=%s\nACME_EMAIL=%s\nCF_DNS_API_TOKEN=%s\nTRAEFIK_DASHBOARD_AUTH=%s\n' \
            "$BASE_DOMAIN" "$ACME_EMAIL" "$CF_DNS_API_TOKEN" "$ESCAPED_AUTH" | base64 -w0)

          PGADMIN_ENV=$(printf 'PGADMIN_DEFAULT_EMAIL=%s\nPGADMIN_DEFAULT_PASSWORD=%s\nPGADMIN_CONFIG_SERVER_MODE=True\nPGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False\n' \
            "$PGADMIN_DEFAULT_EMAIL" "$PGADMIN_DEFAULT_PASSWORD" | base64 -w0)

          N8N_APP_ENV=$(printf '%s\n' \
            "DB_TYPE=postgresdb" "DB_POSTGRESDB_HOST=db-n8n" "DB_POSTGRESDB_PORT=5432" \
            "DB_POSTGRESDB_USER=$N8N_DB_USER" "DB_POSTGRESDB_PASSWORD=$N8N_DB_PASSWORD" \
            "DB_POSTGRESDB_DATABASE=$N8N_DB_NAME" "DB_POSTGRESDB_SCHEMA=public" \
            "N8N_ENCRYPTION_KEY=$N8N_ENCRYPTION_KEY" "N8N_PORT=5678" \
            "N8N_EDITOR_BASE_URL=$N8N_EDITOR_BASE_URL" "WEBHOOK_URL=$N8N_WEBHOOK_URL" \
            "N8N_SECURE_COOKIE=false" "N8N_RUNNERS_ENABLED=true" \
            "N8N_DIAGNOSTICS_ENABLED=false" "N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true" \
            "N8N_DEFAULT_BINARY_DATA_MODE=filesystem" "NODE_FUNCTION_ALLOW_BUILTIN=crypto" \
            "GENERIC_TIMEZONE=Asia/Kuala_Lumpur" "TZ=Asia/Kuala_Lumpur" | base64 -w0)

          N8N_DB_ENV=$(printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\n' \
            "$N8N_DB_USER" "$N8N_DB_PASSWORD" "$N8N_DB_NAME" | base64 -w0)

          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
          set -e
          DEPLOY='$DEPLOY'
          REMOVE='$REMOVE'
          BASE_ENV='$BASE_ENV'
          PGADMIN_ENV='$PGADMIN_ENV'
          N8N_APP_ENV='$N8N_APP_ENV'
          N8N_DB_ENV='$N8N_DB_ENV'

          for stack in \$DEPLOY; do
            echo '=== Deploying '\$stack' ==='
            mkdir -p /root/stacks/\$stack
            echo \"\$BASE_ENV\" | base64 -d > /root/stacks/\$stack/.env
            case \$stack in
              n8n)
                echo \"\$N8N_APP_ENV\" | base64 -d > /root/stacks/n8n/.env.n8n-dev
                echo \"\$N8N_DB_ENV\"  | base64 -d > /root/stacks/n8n/.env.db-n8n ;;
              tools)
                echo \"\$PGADMIN_ENV\" | base64 -d > /root/stacks/tools/.env.pgadmin ;;
            esac
            cd /root/stacks/\$stack
            docker compose up -d --remove-orphans
            docker image prune -af
            echo '=== '\$stack' done ==='
          done

          for stack in \$REMOVE; do
            echo '=== Removing '\$stack' ==='
            if [ -d /root/stacks/\$stack ]; then
              cd /root/stacks/\$stack && docker compose down --remove-orphans
              rm -rf /root/stacks/\$stack
            fi
            echo '=== '\$stack' removed ==='
          done
          "

  # ── VPS2 Production ───────────────────────────────────────────────────────────
  deploy-vps2:
    needs: detect
    if: needs.detect.outputs.vps2 == 'true'
    environment: vps2-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Detect stacks to deploy and remove
        id: stacks
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          EXCLUDE='website'
          ALL_TOUCHED=$(echo "$DIFF" | grep '^vps/vps2-prod/stacks/' \
            | sed 's|vps/vps2-prod/stacks/||;s|/.*||' | sort -u \
            | grep -vxE "$EXCLUDE" || true)
          DEPLOY="" REMOVE=""
          for stack in $ALL_TOUCHED; do
            if [ -d "vps/vps2-prod/stacks/$stack" ]; then
              DEPLOY="$DEPLOY $stack"
            else
              REMOVE="$REMOVE $stack"
            fi
          done
          DEPLOY=$(echo $DEPLOY | xargs); REMOVE=$(echo $REMOVE | xargs)
          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT
          echo "remove=$REMOVE" >> $GITHUB_OUTPUT
          echo "Deploy: $DEPLOY | Remove: $REMOVE"

      - name: Sync compose files
        if: steps.stacks.outputs.deploy != ''
        run: |
          rsync -rltz \
            --exclude='.env' --exclude='.env.*' \
            -e "ssh -i ~/.ssh/id_deploy" \
            vps/vps2-prod/stacks/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/stacks/"

      - name: Deploy and remove stacks
        if: steps.stacks.outputs.deploy != '' || steps.stacks.outputs.remove != ''
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
          PGADMIN_DEFAULT_EMAIL: ${{ vars.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
          DEPLOY: ${{ steps.stacks.outputs.deploy }}
          REMOVE: ${{ steps.stacks.outputs.remove }}
        run: |
          ESCAPED_AUTH=$(printf '%s' "$TRAEFIK_DASHBOARD_AUTH" | sed 's/\$/\$\$/g')

          BASE_ENV=$(printf 'BASE_DOMAIN=%s\nACME_EMAIL=%s\nCF_DNS_API_TOKEN=%s\nTRAEFIK_DASHBOARD_AUTH=%s\n' \
            "$BASE_DOMAIN" "$ACME_EMAIL" "$CF_DNS_API_TOKEN" "$ESCAPED_AUTH" | base64 -w0)

          PGADMIN_ENV=$(printf 'PGADMIN_DEFAULT_EMAIL=%s\nPGADMIN_DEFAULT_PASSWORD=%s\nPGADMIN_CONFIG_SERVER_MODE=True\nPGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False\n' \
            "$PGADMIN_DEFAULT_EMAIL" "$PGADMIN_DEFAULT_PASSWORD" | base64 -w0)

          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
          set -e
          DEPLOY='$DEPLOY'
          REMOVE='$REMOVE'
          BASE_ENV='$BASE_ENV'
          PGADMIN_ENV='$PGADMIN_ENV'

          for stack in \$DEPLOY; do
            echo '=== Deploying '\$stack' ==='
            mkdir -p /root/stacks/\$stack
            echo \"\$BASE_ENV\" | base64 -d > /root/stacks/\$stack/.env
            case \$stack in
              tools)
                echo \"\$PGADMIN_ENV\" | base64 -d > /root/stacks/tools/.env.pgadmin ;;
            esac
            cd /root/stacks/\$stack
            docker compose up -d --remove-orphans
            docker image prune -af
            echo '=== '\$stack' done ==='
          done

          for stack in \$REMOVE; do
            echo '=== Removing '\$stack' ==='
            if [ -d /root/stacks/\$stack ]; then
              cd /root/stacks/\$stack && docker compose down --remove-orphans
              rm -rf /root/stacks/\$stack
            fi
            echo '=== '\$stack' removed ==='
          done
          "

  # ── VPS3 Production ───────────────────────────────────────────────────────────
  deploy-vps3:
    needs: detect
    if: needs.detect.outputs.vps3 == 'true'
    environment: vps3-prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Detect stacks to deploy and remove
        id: stacks
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          else
            DIFF=$(git diff --name-only "$BEFORE" "$SHA")
          fi
          ALL_TOUCHED=$(echo "$DIFF" | grep '^vps/vps3-prod/stacks/' \
            | sed 's|vps/vps3-prod/stacks/||;s|/.*||' | sort -u || true)
          DEPLOY="" REMOVE=""
          for stack in $ALL_TOUCHED; do
            if [ -d "vps/vps3-prod/stacks/$stack" ]; then
              DEPLOY="$DEPLOY $stack"
            else
              REMOVE="$REMOVE $stack"
            fi
          done
          DEPLOY=$(echo $DEPLOY | xargs); REMOVE=$(echo $REMOVE | xargs)
          echo "deploy=$DEPLOY" >> $GITHUB_OUTPUT
          echo "remove=$REMOVE" >> $GITHUB_OUTPUT
          echo "Deploy: $DEPLOY | Remove: $REMOVE"

      - name: Sync compose files
        if: steps.stacks.outputs.deploy != ''
        run: |
          rsync -rltz \
            --exclude='.env' --exclude='.env.*' \
            -e "ssh -i ~/.ssh/id_deploy" \
            vps/vps3-prod/stacks/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/root/stacks/"

      - name: Deploy and remove stacks
        if: steps.stacks.outputs.deploy != '' || steps.stacks.outputs.remove != ''
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          CF_DNS_API_TOKEN: ${{ secrets.CF_DNS_API_TOKEN }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
          N8N_DB_USER: ${{ vars.N8N_DB_USER }}
          N8N_DB_PASSWORD: ${{ secrets.N8N_DB_PASSWORD }}
          N8N_DB_NAME: ${{ vars.N8N_DB_NAME }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_EDITOR_BASE_URL: ${{ vars.N8N_EDITOR_BASE_URL }}
          N8N_WEBHOOK_URL: ${{ vars.N8N_WEBHOOK_URL }}
          DEPLOY: ${{ steps.stacks.outputs.deploy }}
          REMOVE: ${{ steps.stacks.outputs.remove }}
        run: |
          ESCAPED_AUTH=$(printf '%s' "$TRAEFIK_DASHBOARD_AUTH" | sed 's/\$/\$\$/g')

          BASE_ENV=$(printf 'BASE_DOMAIN=%s\nACME_EMAIL=%s\nCF_DNS_API_TOKEN=%s\nTRAEFIK_DASHBOARD_AUTH=%s\n' \
            "$BASE_DOMAIN" "$ACME_EMAIL" "$CF_DNS_API_TOKEN" "$ESCAPED_AUTH" | base64 -w0)

          N8N_APP_ENV=$(printf '%s\n' \
            "DB_TYPE=postgresdb" "DB_POSTGRESDB_HOST=db-n8n" "DB_POSTGRESDB_PORT=5432" \
            "DB_POSTGRESDB_USER=$N8N_DB_USER" "DB_POSTGRESDB_PASSWORD=$N8N_DB_PASSWORD" \
            "DB_POSTGRESDB_DATABASE=$N8N_DB_NAME" "DB_POSTGRESDB_SCHEMA=public" \
            "N8N_ENCRYPTION_KEY=$N8N_ENCRYPTION_KEY" "N8N_PORT=5678" \
            "N8N_EDITOR_BASE_URL=$N8N_EDITOR_BASE_URL" "WEBHOOK_URL=$N8N_WEBHOOK_URL" \
            "N8N_SECURE_COOKIE=false" "N8N_RUNNERS_ENABLED=true" \
            "N8N_DIAGNOSTICS_ENABLED=false" "N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true" \
            "N8N_DEFAULT_BINARY_DATA_MODE=filesystem" "NODE_FUNCTION_ALLOW_BUILTIN=crypto" \
            "GENERIC_TIMEZONE=Asia/Kuala_Lumpur" "TZ=Asia/Kuala_Lumpur" | base64 -w0)

          N8N_DB_ENV=$(printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\n' \
            "$N8N_DB_USER" "$N8N_DB_PASSWORD" "$N8N_DB_NAME" | base64 -w0)

          ssh -i ~/.ssh/id_deploy "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
          set -e
          DEPLOY='$DEPLOY'
          REMOVE='$REMOVE'
          BASE_ENV='$BASE_ENV'
          N8N_APP_ENV='$N8N_APP_ENV'
          N8N_DB_ENV='$N8N_DB_ENV'

          for stack in \$DEPLOY; do
            echo '=== Deploying '\$stack' ==='
            mkdir -p /root/stacks/\$stack
            echo \"\$BASE_ENV\" | base64 -d > /root/stacks/\$stack/.env
            case \$stack in
              n8n)
                echo \"\$N8N_APP_ENV\" | base64 -d > /root/stacks/n8n/.env.n8n-prod
                echo \"\$N8N_DB_ENV\"  | base64 -d > /root/stacks/n8n/.env.db-n8n ;;
            esac
            cd /root/stacks/\$stack
            docker compose up -d --remove-orphans
            docker image prune -af
            echo '=== '\$stack' done ==='
          done

          for stack in \$REMOVE; do
